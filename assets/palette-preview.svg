<text x="258" y="317" font-size="13">A_only</text><text x="258" y="337" font-size="13">#246C8B</text>
<path d="M471 281 H634" stroke="#55764A" stroke-width="3" stroke-dasharray="2 5"/>
<polygon points="552,273 559,281 552,289 545,281" fill="#FFFFFF" stroke="#55764A" stroke-width="2"/>

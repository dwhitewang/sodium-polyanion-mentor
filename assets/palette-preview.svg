<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="850" viewBox="0 0 1160 850">
<rect width="1160" height="850" fill="#FFFFFF"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#2F3438">
<text x="40" y="42" font-size="24" font-weight="600">Original color grammar: roles before decoration</text>
<text x="40" y="69" font-size="14">Design examples only. Not source-paper RGB, experimental data, or accessibility certification.</text>
<text x="40" y="112" font-size="18" font-weight="600">Two samples: stable identity + redundant markers</text>
<path d="M45 142 H208" stroke="#24526B" stroke-width="3" stroke-dasharray=""/>

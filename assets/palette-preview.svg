<text x="258" y="178" font-size="13">modified</text><text x="258" y="198" font-size="13">#B85940</text>
<path d="M471 142 H634" stroke="#737A80" stroke-width="3" stroke-dasharray="2 5"/>
<polygon points="552,135 559,148 545,148" fill="#FFFFFF" stroke="#737A80" stroke-width="2"/>
